[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claimcheck"
version = "0.1.0"
description = "Mechanically verify an AI agent's done-report against files, commands, and HTTP status."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "zlephir42069"}]
keywords = ["agents", "verification", "claims", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/zlephir42069/zlegbot-claimcheck"
Repository = "https://github.com/zlephir42069/zlegbot-claimcheck"

[project.scripts]
claimcheck = "claimcheck.cli:main"

[tool.setuptools.packages.find]
include = ["claimcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
